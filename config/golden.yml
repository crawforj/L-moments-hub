# =============================================================================
# Configuration -- GOLDEN validation case (known-answer benchmark)
#
# This case is run through the IDENTICAL code paths as the real site so a
# reviewer can confirm the machinery reproduces a known truth (see docs/audit_
# guide.md and run_golden.R). Two checks are driven by this config:
#   (a) synthetic known-truth : stations simulated from a known GEV regional
#       growth curve with known index floods; the pipeline must recover them.
#   (b) published benchmark   : the Hosking & Wallis worked example bundled in
#       lmomRFA (data(Cascades)); regtst must reproduce the book's statistics.
# The golden data are pre-frozen annual-maximum series (local "ams" format), so
# this case needs no network and is fully deterministic.
# =============================================================================

site:
  name: "Golden (synthetic GEV region)"
  id: "GOLDEN"
  latitude: 46.0
  longitude: -114.0
  elevation_m: 1200

region:
  search_radius_km: 100000       # accept all golden stations (no geographic filter)
  elevation_band_m: [-1000, 9000]
  min_record_years: 20
  min_year_completeness: 0.0      # AMS supplied directly; no daily completeness gate

durations:
  - { label: "syn", days: 1, fixed_interval_factor: 1.0 }  # no correction for synthetic truth

season:
  start_month: 1                  # full year -- synthetic AMS carry no season
  end_month: 12

distributions: ["glo", "gev", "gno", "pe3", "gpa"]
distribution_override: null       # must land on "gev" automatically

return_periods: [2, 5, 10, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000]

index_flood:
  method: "nearest"

uncertainty:
  n_sim: 500
  conf: 0.90

data:
  source: "local"                 # golden never downloads
  use_local_fallback: true
  local_format: "ams"             # station_id, year, value
  local_dir: "golden"
  ghcn_base: ""

# Known truth used to (a) generate the synthetic AMS and (b) score recovery.
# GEV parameterisation follows lmom::quagev = c(location xi, scale alpha, shape k).
# Records are deliberately long and the region large so the pipeline recovers the
# TRUE growth curve tightly; tolerances reflect the residual sampling error that
# remains even for a correctly implemented method at the 10,000-yr extrapolation.
golden_truth:
  distribution: "gev"
  gev_param: [50.0, 15.0, -0.10]  # regional growth-curve shape (site-mean-scaled)
  n_sites: 25
  years_per_site: 200
  index_flood_min: 40             # site index floods span this range (evenly)
  index_flood_max: 64
  tolerance:
    growth_curve_rel: 0.08        # recovered growth curve within 8% for T <= 1000
    q_10000_rel: 0.12             # 10,000-yr growth factor within 12% of truth

seed: 12345

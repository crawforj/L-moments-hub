# =============================================================================
# Configuration -- Regional Precipitation Frequency Analysis
# Site: Como Dam / Lake Como, Bitterroot Valley, Ravalli County, Montana
#
# This file is the ONLY thing you must edit to run the analysis for a different
# basin. Copy it (e.g. config/mybasin.yml), change the values, and run:
#   Rscript run_analysis.R config/mybasin.yml
# Every value below is documented; nothing basin-specific is hard-coded in R.
# =============================================================================

site:
  name: "Como Dam"              # label used in outputs / figure titles
  id: "COMO_DAM"               # short slug used in output filenames
  latitude: 46.0583             # decimal degrees N  (Lake Como outlet, approx.)
  longitude: -114.2306          # decimal degrees E (negative = W)
  elevation_m: 1240             # site elevation, metres (approx. dam crest area)

region:
  search_radius_km: 175         # candidate stations within this radius of the site
  elevation_band_m: [-100, 6200] # WIDENED 2026-08-11: this file doubles as the fleet
                                 # batch TEMPLATE (gen_configs_from_manifest() copies
                                 # this whole region: block unchanged to every facility).
                                 # The old [600,2600] band -- fine for Como's ~1240m
                                 # Montana site -- silently zeroed the candidate pool
                                 # for any low-elevation facility: confirmed 272/311
                                 # (87.5%) of fleet failures so far were this, not a
                                 # real data gap (e.g. Minnesota's Miltona Lake dam has
                                 # 118 valid nearby GHCN stations, ALL below 600m).
                                 # Widened to cover from below Death Valley to above
                                 # Denali. The REAL region-homogeneity gate is the H&W
                                 # discordancy (Di) and heterogeneity (H1) statistics
                                 # downstream (03/04_*.R), which operate on L-moment
                                 # ratios (storm-regime shape), not raw elevation -- a
                                 # tight elevation prefilter was never the actual
                                 # safeguard, just an efficiency/geographic filter.
                                 # Re-validated Como itself under this wider band
                                 # (see docs/batch_runs_guide.md) before relying on it.
  min_record_years: 20          # drop stations with fewer valid annual maxima
  min_year_completeness: 0.90   # fraction of in-season days required per year
  max_stations: 60              # cap nearest GHCN stations pulled (bounds download)

# Precipitation durations to analyse.
# GHCN-Daily gives calendar-day totals, so a d-day running total approximates
# the (24*d)-hour depth; the fixed-interval factor corrects toward true
# clock-hour depths (WMO-No.1045 / Hershfield): ~1.13 for 1-day, ~1.03 for 3-day.
durations:
  - { label: "24h", days: 1, fixed_interval_factor: 1.13 }
  - { label: "72h", days: 3, fixed_interval_factor: 1.03 }

# Seasonal window for extracting annual maxima. DEFAULT IS THE FULL CALENDAR
# YEAR (1..12) - the true annual-maximum precipitation, which is what a
# dam-safety precipitation-frequency analysis needs: the controlling extreme
# daily/multi-day storm in western Montana is often a late-summer convective
# cloudburst or a fall rain-on-snow event, OUTSIDE the spring window. Restrict
# to a season (e.g. start_month 4, end_month 7 for the Bitterroot spring
# snowmelt / rain-on-snow season) ONLY for a season-specific study; note that
# doing so biases the precipitation-frequency estimates LOW (measured: ~12-14%
# lower at 24h and up to ~54% lower at 72h for Como).
season:
  start_month: 1
  end_month: 12

# Candidate distributions tested at the distribution-selection step (H&W ch. 5).
# The one with the smallest |Z| (<= 1.64) is chosen unless overridden below.
distributions: ["glo", "gev", "gno", "pe3", "gpa"]
distribution_override: null     # e.g. "gev" to force a choice; null = automatic

# Return periods (years) for the depth-duration-frequency output. 10000 -> AEP 1e-4.
return_periods: [2, 5, 10, 25, 50, 100, 200, 500, 1000, 2000, 5000, 10000]

# Index-flood transfer to the (ungauged) dam site. "regression" fits site-mean
# ~ elevation across regional gauges; "nearest" uses the closest gauge's mean.
index_flood:
  method: "regression"          # "regression" | "nearest"

uncertainty:
  n_sim: 500                    # Monte-Carlo repetitions for regsimq / regtst
  conf: 0.90                    # error-bound confidence level

data:
  source: "ghcn"                # "ghcn" (auto-download) | "local"
  use_local_fallback: false     # TEMPORARILY DISABLED (2026-08-11): the NID fleet
                                 # batch was silently substituting SYNTHETIC data for
                                 # any facility whose GHCN download failed, and still
                                 # recording it as a successful ("ok") result in the
                                 # ledger -- ~110/753 facilities attempted so far
                                 # (~15%) did this undetected. With this off, a GHCN
                                 # failure now correctly fails the facility (visible in
                                 # batch_status.csv / needs re-attempt) instead of
                                 # silently faking a result. Re-enable only for a
                                 # deliberate offline demo/test run, never for a fleet
                                 # batch whose results might be reviewed.
  local_format: "daily"         # "daily" (date,prcp per station) | "ams"
  local_dir: "data/external"    # where local station files live
  ghcn_base: "https://noaa-ghcn-pds.s3.amazonaws.com"  # AWS Open-Data GHCN-Daily mirror (reachable where www.ncei.noaa.gov is blocked); NCEI base also supported
  ghcn_cache_dir: "data/raw/ghcn"  # cached inventory + per-station files (shared across facilities)
  qflag_screen: true            # drop GHCN observations with a non-blank quality flag (failed QA)
  qflag_keep: []                # QFLAG codes to retain despite being non-blank (default: none)

seed: 20260811                  # RNG seed -> reproducible screening/simulation

name: NID fleet batch (manual)

# Manual-only on purpose: this repo already runs the same resumable fleet
# batch from a desktop machine (see docs/batch_runs_guide.md); this workflow
# is a free, genuinely-parallel (Linux runner -> R's mclapply actually works,
# unlike Windows) alternative/supplement, NOT something that should fire on
# its own and race the desktop loop for the same branch's ledger. Trigger it
# by hand (Actions tab -> Run workflow, or `gh workflow run nid-batch.yml`)
# only once you've confirmed nothing else is committing to the target branch.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch with the fleet code + ledger to check out and push back to'
        required: true
        default: 'claude/desktop-nid-ad-hoc'
      tranche_size:
        description: 'Facilities per Rscript run_nid_tranche.R call'
        required: false
        # Real measured rate (2026-08-14, ubuntu-latest runner): ~200
        # facilities took ~2,400s consistently across 6 rounds (~12s/dam) --
        # at that rate a 200-facility round runs ~40 min, and the inner loop
        # only checks its time budget BETWEEN rounds, so a round that starts
        # late in the budget window can carry the job well past the 350-min
        # hard timeout before it finishes, wasting that whole round's
        # progress (never committed -- see run_nid_tranche.R's buffer-then-
        # commit design). Shrunk from 400 -> 75 (~15 min/round at the same
        # measured rate) so the worst-case wasted tail is ~15-20 min instead
        # of up to ~40, without making per-round fixed overhead (R startup,
        # GHCN inventory reload, git commit+push) dominate.
        default: '75'
      budget_minutes:
        description: 'Wall-clock budget for this job (kept under the 360-min GH Actions hard limit)'
        required: false
        default: '330'

permissions:
  contents: write
  actions: write   # needed to dispatch the next run (self-chaining, see final step)

# Belt-and-suspenders: even though this workflow chains itself rather than
# relying on overlapping schedules, a concurrency group means a stray manual
# trigger (or two chained runs somehow overlapping) queues instead of racing
# another run for the same branch's ledger.
concurrency:
  group: nid-batch-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  run-fleet-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          # NO lfs:true anymore (2026-08-17 cost fix). The cumulative fleet
          # tables briefly lived in LFS (2026-08-13, after they crossed the
          # 50MB push soft-limit), but every ~17-min round rewrites ~950MB of
          # CSVs and LFS stores each version IN FULL: ~20 rounds/job x ~4
          # jobs/day ~= 75GB/day of new LFS storage against a 10GiB free
          # quota, plus ~950MB of LFS bandwidth per lfs:true checkout. Once
          # over the storage quota GitHub blocks new LFS uploads and serves
          # only pointer files -- which would corrupt-and-kill this chain.
          # The big tables now live as gzipped assets on the fixed release
          # tag `nid-run1-data` (free storage, no LFS involved); only the
          # small ledger (completed_ids.csv, progress.md) stays in git as
          # plain text. Nothing else in the job needs LFS content (the GHCN
          # cache data/ghcn_prcp_cache/*.csv.gz is regular git).

      - name: Restore cumulative fleet tables from release assets
        # Replaces the old lfs:true checkout as the source of the big
        # cumulative tables. Consistency invariant (see the upload half in
        # the tranche loop): assets >= state manifest >= committed ledger,
        # always. append_cum_csv() de-dups on the natural key, so tables
        # AHEAD of the ledger merely re-fold a few facilities harmlessly;
        # a ledger AHEAD of the tables would silently orphan completed
        # facilities -- that direction is a hard failure here, and the
        # chain step below refuses to dispatch a successor when this step
        # fails, so a bad state pauses the fleet instead of looping on it.
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=nid-run1-data
          BIG="all_facilities_DDF batch_diagnostics gof growth_curve regional_lmoments stations_removed stations_used tail_sensitivity"
          # Transition guard: if the ledger branch still LFS-tracks these
          # paths, this plain checkout produced pointer files and a run
          # would corrupt the ledger. Fail loudly; push the untracking
          # commit to the fleet branch first.
          if git check-attr filter -- data/nid_progress/completed_ids.csv | grep -q 'lfs'; then
            echo "::error::Fleet branch still LFS-tracks data/nid_progress -- push the untracking commit before running this workflow."
            exit 1
          fi
          if head -c 200 data/nid_progress/completed_ids.csv 2>/dev/null | grep -q 'git-lfs'; then
            echo "::error::completed_ids.csv is an LFS pointer file in this checkout -- refusing to run."
            exit 1
          fi
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [ -s data/nid_progress/completed_ids.csv ]; then
              echo "::error::Release $TAG does not exist but completed_ids.csv is non-empty -- the cumulative tables would restart empty and silently orphan every completed facility. Seed the release first (see docs/NID_COMPLETION_RUNBOOK.md)."
              exit 1
            fi
            echo "No $TAG release and an empty ledger -- true first run, starting fresh."
            exit 0
          fi
          rm -rf /tmp/nid_assets && mkdir -p /tmp/nid_assets
          for attempt in 1 2 3; do
            gh release download "$TAG" --repo "${{ github.repository }}" --dir /tmp/nid_assets --clobber && break
            if [ "$attempt" = 3 ]; then
              echo "::error::Failed to download $TAG assets after 3 attempts."
              exit 1
            fi
            sleep 20
          done
          for name in $BIG; do
            if [ ! -f "/tmp/nid_assets/$name.csv.gz" ]; then
              echo "::error::Release $TAG is missing asset $name.csv.gz -- inconsistent seed, refusing to run."
              exit 1
            fi
            gunzip -c "/tmp/nid_assets/$name.csv.gz" > "data/nid_progress/$name.csv"
          done
          if [ ! -f /tmp/nid_assets/nid_state.json ]; then
            echo "::error::Release $TAG has no nid_state.json manifest -- cannot prove the tables cover the ledger, refusing to run."
            exit 1
          fi
          LEDGER_ROWS=$(wc -l < data/nid_progress/completed_ids.csv 2>/dev/null || echo 0)
          MAN_ROWS=$(jq -r '.completed_rows' /tmp/nid_assets/nid_state.json)
          echo "Ledger rows in checkout: $LEDGER_ROWS | rows covered by release assets: $MAN_ROWS"
          if [ "$LEDGER_ROWS" -gt "$MAN_ROWS" ]; then
            echo "::error::Committed ledger ($LEDGER_ROWS rows) is AHEAD of the release assets ($MAN_ROWS rows) -- running now would orphan completed facilities. Re-upload assets from a checkout matching the ledger, then re-dispatch."
            exit 1
          fi
          ls -la data/nid_progress/

      - name: Set up R
        # 2026-08-19: this action hung 5h50m on one run, burning the entire
        # job window before a single dam was processed (steps after it were
        # skipped). Normal duration is ~40s. Fail fast instead -- the chain
        # step still dispatches a successor, so a hang now costs minutes.
        timeout-minutes: 12
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies (sf / geospatial + gfortran for lmom + libuv for testthat's deps)
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libproj-dev libgeos-dev libudunits2-dev gfortran libuv1-dev

      - name: Install R packages
        timeout-minutes: 35   # generous: covers a source-build fallback if RSPM binaries are unavailable
        # Prefer the RSPM binary mirror (fast, prebuilt) with plain CRAN as a
        # source-build fallback -- the first real run of this workflow hardcoded
        # plain CRAN here by mistake, forcing sf/lmom/lmomRFA etc. to all compile
        # from source (took ~10+ min instead of ~1-2).
        run: |
          Rscript -e '
            repos <- c(RSPM = Sys.getenv("RSPM", "https://packagemanager.posit.co/cran/__linux__/noble/latest"),
                       CRAN = "https://cloud.r-project.org")
            install.packages(c("lmom","lmomRFA","yaml","jsonlite","ggplot2","sf","maps","testthat"), repos = repos)'

      - name: Verify every required package actually installed
        # install.packages() with multiple packages does NOT fail the step (and
        # so does not fail this job) when an individual package fails partway --
        # the first real run showed this step green while testthat had silently
        # failed to install (a missing system lib for one of its dependencies).
        # Check explicitly rather than trusting the previous step's exit code.
        run: |
          Rscript -e '
            need <- c("lmom","lmomRFA","yaml","jsonlite","ggplot2","sf","maps","testthat")
            have <- rownames(installed.packages())
            missing <- setdiff(need, have)
            if (length(missing)) {
              cat("::error::Missing R packages after install step:", paste(missing, collapse=", "), "\n")
              quit(status = 1)
            }
            cat("All required packages present:", paste(need, collapse=", "), "\n")'

      - name: Validate before trusting this run
        timeout-minutes: 25
        run: |
          Rscript run_golden.R
          Rscript run_tests.R

      - name: Refuse to run if synthetic fallback is enabled
        # See docs/batch_runs_guide.md, "Never run unattended with synthetic
        # fallback on" -- this already caused a real incident once. An
        # unattended CI batch is exactly the scenario that bit us before.
        run: |
          if grep -q "use_local_fallback: true" config/como.yml; then
            echo "::error::config/como.yml has use_local_fallback: true -- refusing to run an unattended fleet batch that could silently fake results. Fix the config and re-run."
            exit 1
          fi
          echo "use_local_fallback check passed (not true)."

      - name: Configure git identity for automated commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Report parallelism actually available
        run: |
          Rscript -e 'cat("Cores detected:", parallel::detectCores(), "| OS:", .Platform$OS.type, "\n")'

      - name: Run NID tranches until the time budget is spent
        env:
          LMC_TRANCHE: ${{ inputs.tranche_size }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUDGET_SECONDS=$(( ${{ inputs.budget_minutes }} * 60 ))
          START=$(date +%s)
          ROUND=0
          TAG=nid-run1-data
          BIG="all_facilities_DDF batch_diagnostics gof growth_curve regional_lmoments stations_removed stations_used tail_sensitivity"
          while true; do
            ROUND=$((ROUND+1))
            NOW=$(date +%s)
            ELAPSED=$((NOW-START))
            if [ "$ELAPSED" -ge "$BUDGET_SECONDS" ]; then
              echo "Time budget spent (${ELAPSED}s >= ${BUDGET_SECONDS}s). Stopping cleanly."
              break
            fi
            echo "===== Round $ROUND (elapsed ${ELAPSED}s / budget ${BUDGET_SECONDS}s) ====="
            Rscript run_nid_tranche.R || echo "::warning::run_nid_tranche.R exited non-zero this round; continuing to next round."

            # Only the small ledger goes to git (plain text, delta-compresses
            # fine). The ~950MB of cumulative tables go to release assets --
            # NEVER `git add data/nid_progress/` wholesale again (that is what
            # was burning ~75GB/day of LFS storage).
            git add data/nid_progress/completed_ids.csv data/nid_progress/progress.md data/ghcn_prcp_cache/
            if ! git diff --cached --quiet; then
              # ---- publish cumulative tables as release assets (replaces LFS) ----
              # Order is the crash-consistency invariant: (1) csv.gz assets,
              # (2) nid_state.json manifest, (3) git push of the ledger. A
              # failure at any point leaves origin's ledger <= manifest <=
              # assets, which the restore step accepts (append_cum_csv
              # de-dups on the natural key, so re-folding already-published
              # facilities is harmless). The reverse order could publish a
              # ledger whose facilities are missing from the tables --
              # silent, permanent data loss. So an upload failure must abort
              # this job BEFORE the ledger push (set -e does that), costing
              # at most this round; the chained successor resumes from the
              # last consistent state.
              rm -rf /tmp/nid_assets_up && mkdir -p /tmp/nid_assets_up
              for name in $BIG; do
                f="data/nid_progress/$name.csv"
                if [ -f "$f" ]; then
                  gzip -3 -c "$f" > "/tmp/nid_assets_up/$name.csv.gz"
                fi
              done
              ROWS=$(wc -l < data/nid_progress/completed_ids.csv)
              printf '{"completed_rows": %s, "commit": "%s", "uploaded_at": "%s"}\n' \
                "$ROWS" "$(git rev-parse HEAD)" "$(date -u +%FT%TZ)" > /tmp/nid_assets_up/nid_state.json
              UPLOADED=0
              for attempt in 1 2 3; do
                if gh release upload "$TAG" /tmp/nid_assets_up/*.csv.gz --clobber --repo "${{ github.repository }}" \
                   && gh release upload "$TAG" /tmp/nid_assets_up/nid_state.json --clobber --repo "${{ github.repository }}"; then
                  UPLOADED=1
                  break
                fi
                sleep 20
              done
              if [ "$UPLOADED" != 1 ]; then
                echo "::error::Release asset upload failed 3x -- aborting before the ledger push so the tables can never fall behind the ledger. This round will be re-attempted by the successor."
                exit 1
              fi

              SUMMARY=$(grep 'Facilities attempted' data/nid_progress/progress.md || echo 'progress updated')
              git commit -q -m "NID GH-Actions tranche (round $ROUND): $SUMMARY"
              git push -q origin HEAD:"${{ inputs.branch }}"
              echo "Committed and pushed round $ROUND (ledger to git, tables to release $TAG)."
            else
              echo "No changes to commit this round."
            fi

            if grep -q "All NID facilities complete" data/nid_progress/progress.md 2>/dev/null; then
              echo "Full NID fleet complete. Stopping."
              break
            fi
          done

      - name: Upload progress summary as a build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nid-progress-${{ github.run_id }}
          path: data/nid_progress/progress.md

      - name: Chain -- trigger the next run unless the fleet is complete
        # Makes this genuinely autonomous: a single run can't fit all 73,303
        # facilities (job time is capped at ~6h by GitHub), so each run
        # dispatches its own successor with the same settings, using the
        # workflow_dispatch exception to the "GITHUB_TOKEN can't trigger
        # workflows" rule. `if: always()` so this fires even if the tranche
        # loop above got cut off by the job timeout mid-round (matches the
        # same "at most one in-flight tranche lost" safety property as
        # everywhere else in this pipeline) -- an unfinished round just means
        # the next run re-attempts those same not-yet-completed facilities,
        # same as the ledger's normal resumability.
        #
        # EXCEPT when the restore step failed: that means the release-asset
        # state and the committed ledger disagree (or the branch is still
        # LFS-tracked mid-transition), and every successor would fail the
        # same way -- chaining would just be a ~2-min dispatch loop burning
        # Actions minutes until someone notices. Pause instead; fix the
        # assets/branch and re-dispatch by hand.
        if: always() && steps.restore.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "All NID facilities complete" data/nid_progress/progress.md 2>/dev/null; then
            echo "Full NID fleet complete -- not chaining a next run."
          else
            echo "Fleet not yet complete -- dispatching the next run."
            # Deliberately do NOT propagate tranche_size/budget_minutes: the
            # successor picks up the workflow file's current defaults from
            # main instead. Propagating them made tuning impossible -- every
            # cancelled run's always()-chain re-dispatched the OLD value
            # ahead of any operator redispatch (a real race hit 2026-08-14:
            # the 400->75 tranche default took multiple generations to
            # actually land because each cancel spawned a successor pinned
            # to the old explicit input, beating the manual fix every time).
            gh workflow run nid-batch.yml --repo "${{ github.repository }}" \
              -f branch="${{ inputs.branch }}"
          fi
